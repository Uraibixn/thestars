name: Star families CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("dplyr", "jsonlite", "testthat"))'
      - name: Run the pipeline (downloads HYG, writes stars.json)
        run: Rscript pipeline/01_bright_stars.R
      - name: Test stars.json
        run: Rscript -e 'testthat::test_dir("tests")'
